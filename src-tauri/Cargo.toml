[package]
name = "medflow-desktop"
version = "0.1.0"
description = "MedFlow CRM — настольная оболочка"
authors = ["ЛЕ Клиника"]
edition = "2021"
rust-version = "1.77"

# Имя итогового бинарника (medflow-desktop.exe)
[[bin]]
name = "medflow-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
