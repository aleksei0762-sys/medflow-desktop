<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedFlow CRM</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1f3a; color: #fff;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
      .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
      .box { text-align: center; opacity: .85; }
      .box b { font-size: 18px; }
      .box span { display:block; margin-top:8px; font-size:13px; color:#9fb2d0; }
    </style>
  </head>
  <body>
    <!-- Этот экран почти не виден: сразу после запуска открывается окно с /crm/.
         Он нужен только как локальный fallback, которого требует сборщик Tauri. -->
    <div class="wrap">
      <div class="box">
        <b>MedFlow CRM запускается…</b>
        <span>Открываем рабочий экран клиники</span>
      </div>
    </div>
  </body>
</html>
